<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc"><title id="title">AI automation workflow mindset</title><desc id="desc">A pixel-inspired automation dashboard showing observe, connect, augment, and review, with an AI automation focus.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111b"/><stop offset="1" stop-color="#11102a"/></linearGradient><linearGradient id="accent" x1="0" x2="1"><stop stop-color="#58e6d2"/><stop offset=".52" stop-color="#8be9fd"/><stop offset="1" stop-color="#b6a2ff"/></linearGradient><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#23354b" stroke-width=".65" opacity=".55"/><rect x="1" y="1" width="2" height="2" fill="#4ce0ce" opacity=".18"/></pattern><pattern id="pixels" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#58e6d2" opacity=".8"/><rect x="6" y="6" width="3" height="3" fill="#b6a2ff" opacity=".55"/></pattern><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="470" rx="24" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="468" rx="23" fill="url(#grid)" stroke="#2b405c" stroke-width="2"/><path d="M24 54h60M24 54v60M1176 416h-60M1176 416v-60" stroke="#58e6d2" stroke-width="3" opacity=".75"/><g font-family="monospace" fill="#8a9bb5"><text x="54" y="48" font-size="14" letter-spacing="4">FIELD NOTES / 01 — HUMAN-CENTRED SYSTEMS</text><text x="1010" y="48" font-size="13" letter-spacing="2">CYPRUS · LIVE</text></g><g transform="translate(58 102)"><rect x="0" y="0" width="8" height="8" fill="#58e6d2"/><text x="22" y="9" fill="#83e8df" font-family="monospace" font-size="13" letter-spacing="3">FOCUS AREA</text><text x="0" y="78" fill="#eff6ff" font-family="monospace" font-size="58" font-weight="700" letter-spacing="-3">AI +</text><text x="0" y="139" fill="#eff6ff" font-family="monospace" font-size="58" font-weight="700" letter-spacing="-3">AUTOMATION</text><rect x="1" y="164" width="310" height="5" fill="url(#accent)"/><text x="2" y="204" fill="#a5b4cb" font-family="monospace" font-size="15">Useful systems. Clear handoffs.</text><text x="2" y="228" fill="#a5b4cb" font-family="monospace" font-size="15">Human judgement stays in the loop.</text><g transform="translate(0 265)" font-family="monospace" font-size="12"><rect width="106" height="30" rx="6" fill="#102735" stroke="#31656b"/><text x="14" y="20" fill="#72eadc">N8N</text><rect x="116" width="112" height="30" rx="6" fill="#141d36" stroke="#454d80"/><text x="130" y="20" fill="#b9b0ff">REST APIs</text><rect x="238" width="86" height="30" rx="6" fill="#102735" stroke="#31656b"/><text x="252" y="20" fill="#72eadc">RAG</text></g></g><g transform="translate(445 105)"><text x="0" y="0" fill="#91a3be" font-family="monospace" font-size="12" letter-spacing="3">HOW I WORK / A REPEATABLE LOOP</text><path d="M83 106H190M250 106h63M374 106h63" fill="none" stroke="url(#accent)" stroke-width="3" stroke-dasharray="7 7" opacity=".8"/><g font-family="monospace" text-anchor="middle"><g transform="translate(0 43)"><rect width="145" height="140" rx="13" fill="#0b1926" stroke="#32606a"/><rect x="18" y="19" width="26" height="26" fill="url(#pixels)"/><text x="72" y="81" fill="#dffaf5" font-size="15" font-weight="700">OBSERVE</text><text x="72" y="106" fill="#8294ad" font-size="11">Find the real friction</text></g><g transform="translate(165 43)"><rect width="145" height="140" rx="13" fill="#0d1729" stroke="#424e83"/><path d="M25 34h32M41 18v32" stroke="#b6a2ff" stroke-width="4"/><text x="72" y="81" fill="#e9e6ff" font-size="15" font-weight="700">CONNECT</text><text x="72" y="106" fill="#9293b9" font-size="11">APIs · tools · context</text></g><g transform="translate(330 43)"><rect width="145" height="140" rx="13" fill="#0b1926" stroke="#32606a"/><path d="M26 35h32M29 28l-7 7 7 7M55 28l7 7-7 7" fill="none" stroke="#58e6d2" stroke-width="3"/><text x="72" y="81" fill="#dffaf5" font-size="15" font-weight="700">AUGMENT</text><text x="72" y="106" fill="#8294ad" font-size="11">Let AI help with the work</text></g><g transform="translate(495 43)"><rect width="145" height="140" rx="13" fill="#0d1729" stroke="#424e83"/><path d="M23 31l12 12 25-28" fill="none" stroke="#b6a2ff" stroke-width="4"/><text x="72" y="81" fill="#e9e6ff" font-size="15" font-weight="700">REVIEW</text><text x="72" y="106" fill="#9293b9" font-size="11">Check · refine · learn</text></g></g><g transform="translate(0 230)" font-family="monospace"><rect width="640" height="76" rx="10" fill="#0b1421" stroke="#24334c"/><text x="20" y="28" fill="#58e6d2" font-size="11" letter-spacing="2">DESIGN PRINCIPLE</text><text x="20" y="54" fill="#d2dced" font-size="14">Automate the handoff; keep people close to the decision.</text></g></g><g transform="translate(58 415)" font-family="monospace" font-size="11" letter-spacing="2" fill="#7588a3"><text>ERASMUS+ TRAINEE</text><circle cx="157" cy="-4" r="3" fill="#58e6d2" filter="url(#glow)"/><text x="176">CYPRUS</text><text x="956">BUILD WITH INTENT / 2026</text></g></svg>
